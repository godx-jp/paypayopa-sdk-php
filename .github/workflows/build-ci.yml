name: Paypay PHP SDK CI
# `workflow_dispatch` thêm 05/09/2026: fork này chưa từng có lượt chạy nào
# (workflow bị tắt mặc định trên fork, phải bật tay) — có nút chạy tay thì
# không phải đẩy commit rỗng chỉ để kích CI.
#
# `schedule` thêm 06/09/2026 cho làn CHẬM — xem chú thích ở `strategy.matrix`.
# CONTRACT L6 — `paths-ignore` là bắt buộc: sửa mỗi README mà kích cả bộ test
# (4 leg × 76s) là một lỗi cấu hình. Viết lặp hai lần vì trình đọc workflow của
# GitHub KHÔNG hỗ trợ anchor/alias của YAML.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - 'LICENSE'
  schedule:
    # 02:00 JST mỗi ngày = 17:00 UTC hôm trước. Chỉ chạy trên nhánh mặc định
    # (`master`) — đó là hành vi cố định của `schedule`, không cấu hình được.
    - cron: '0 17 * * *'
  workflow_dispatch:

# CONTRACT L7 — làn PR: push thứ hai làm kết quả của push thứ nhất vô nghĩa,
# huỷ nó là trả runner lại cho đàn. Đây KHÔNG phải workflow deploy nên
# `cancel-in-progress: true` là chiều đúng.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # RUNNER — `[self-hosted, swarm-pool]`, không phải `ubuntu-latest`. Runner của
    # GitHub tính tiền; từ 09/2026 cả org chạy trên đàn `swarm-pool` (image
    # `tempo-runner-php:noble`: PHP 8.4 + Composer, KHÔNG có java, KHÔNG có make,
    # có docker CLI dùng chung daemon của host). Gọi đích danh nhãn `swarm-pool`:
    # `self-hosted` một mình là nhãn tự động, không phân biệt được máy nào.
    runs-on: [self-hosted, swarm-pool]
    strategy:
      # CONTRACT L4 — BA LÀN. Ma trận rộng thuộc làn CHẬM, không gác merge:
      #   · làn BẮT BUỘC (push / PR / chạy tay): chỉ 8.4 — đúng bản PHP của image
      #     runner, chạy thẳng, không cần container phụ.
      #   · làn CHẬM (`schedule`, 02:00 JST): 8.1 / 8.2 / 8.3 trong `php:<ver>-cli`.
      # Đo lượt 33972065527: 4 leg × 76s ≈ 304 s/lượt. Còn 1 leg ở làn bắt buộc
      # ⇒ **−228 s/lượt** cho mỗi push, mà vẫn giữ nguyên độ phủ 8.1–8.4 mỗi đêm.
      matrix:
        php-version: ${{ fromJSON(github.event_name == 'schedule' && '["8.1","8.2","8.3"]' || '["8.4"]') }}
      # Làn bắt buộc chỉ còn MỘT leg nên fail-fast không tiết kiệm khe hàng đợi
      # nào nữa; ở làn nightly ta muốn biết cả ba bản PHP cũ hỏng ra sao trong
      # một lượt, chứ không phải leg đầu đỏ là mất luôn thông tin hai leg kia.
      fail-fast: false
    env:
      PHP: ${{ matrix.php-version }}
    steps:
      # `@v2` (tới 05/09/2026) chạy trên runtime Node đã hết hỗ trợ và mất 47s
      # cho một checkout SDK nhỏ ở lượt 33972065527. Ghim theo SHA đúng quy ước
      # các repo khác trong org (godx-task dùng cùng SHA này).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `$HOME` trên runner dùng chung không thuộc về CI. Trỏ COMPOSER_HOME vào
      # thư mục tạm của lượt chạy, và mồi kho tải đã bake sẵn trong image —
      # container phù du nên `vendor/` phải dựng lại mỗi job.
      - name: Composer không đọc HOME dùng chung
        run: |
          echo "COMPOSER_HOME=$RUNNER_TEMP/composer-home" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/composer-cache"
          [ -d /opt/composer-cache ] && cp -a /opt/composer-cache/. "$RUNNER_TEMP/composer-cache/" 2>/dev/null || true
          echo "COMPOSER_CACHE_DIR=$RUNNER_TEMP/composer-cache" >> "$GITHUB_ENV"

      # Cài bằng Composer của image (PHP 8.4) cho MỌI bản trong ma trận, kể cả
      # 8.1–8.3 rồi mới đem `vendor/` vào container php:<ver>-cli ở bước test.
      # Kết quả không đổi theo PHP thật vì composer.json ghim
      # `config.platform.php = 8.3.0`: Composer giải phụ thuộc theo con số ấy,
      # không theo bản PHP đang chạy. Không cài trong container vì image
      # `php:<ver>-cli` không có composer, không có unzip/git/ext-zip — mỗi job
      # sẽ phải `apt-get` lại từ đầu.
      - name: Run composer
        run: composer install

      # WireMock trong `make run_mock` chạy bằng `java -jar mock/wiremock.jar` —
      # image runner không có java (và không có make). Chạy ĐÚNG jar ấy, đúng
      # tham số ấy, trong container JRE gắn vào NAMESPACE MẠNG của runner
      # (`--network container:$(hostname)`): `localhost:8080` trong job chính là
      # WireMock, không qua host, không va cổng với job khác trong ma trận.
      #
      # `docker cp` thay vì `-v`: runner là container, workspace nằm trong overlay
      # của nó — bind mount `-v "$PWD:…"` trỏ vào đường dẫn TRÊN HOST, và ở đó
      # trống (đo 05/09/2026: `ls /app` → rỗng). Đây là CONTRACT L13.
      - name: Khởi động WireMock
        run: |
          name="ci-wiremock-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PHP}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          cid=$(docker create --name "$name" --network "container:$(hostname)" -w /mock \
            eclipse-temurin:11-jre java -jar wiremock.jar --verbose)
          docker cp mock/. "$cid:/mock"
          docker start "$cid" >/dev/null
          echo "WIREMOCK=$name" >> "$GITHUB_ENV"
          curl -s -o /dev/null -w "%{http_code}" localhost:8080/__admin/mappings --retry-connrefused --retry 60 --retry-max-time 60

      # CONTRACT Nguyên tắc 3 — hỏng phải KÊU. Một WireMock khởi động KHÔNG có
      # mapping nào vẫn trả 200 ở `__admin/mappings`, và khi đó bộ test hoặc đỏ
      # khó hiểu, hoặc tệ hơn: xanh vì không gọi gì. Đếm mapping và đỏ nếu = 0.
      # Đo 06/09/2026 trên `mock/mappings`: 26 mapping.
      - name: Khẳng định WireMock đã nạp mapping
        run: |
          n=$(curl -sf localhost:8080/__admin/mappings \
            | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["meta"]["total"] ?? count($d["mappings"] ?? []);')
          echo "WireMock đã nạp $n mapping"
          [ "${n:-0}" -gt 0 ] \
            || { echo "::error::WireMock chạy nhưng KHÔNG nạp mapping nào — kiểm bước docker cp mock/."; exit 1; }

      # Dòng phpunit theo `make run_mock` (Makefile), BỎ `--coverage-clover`:
      # ba nơi tiêu thụ clover.xml (Coveralls + CodeClimate before/after) đều đã
      # chết và đã gỡ ở commit này, nên sinh coverage là trả giá cho một tệp
      # không ai đọc — và nó buộc image runner phải có xdebug/pcov, thứ chưa
      # khẳng định được. Muốn bật lại: thêm một bước khẳng định driver coverage
      # đỏ-được TRƯỚC bước này, đừng để phpunit cảnh báo rồi thoát 1 (đo
      # 06/09/2026: thiếu driver ⇒ "No code coverage driver available", exit 1
      # DÙ 46/46 test xanh — đúng kiểu hỏng im lặng mà CONTRACT cấm).
      #
      # Bản trùng với PHP của image (8.4) chạy thẳng; bản khác chạy trong
      # `php:<ver>-cli`, cùng namespace mạng với runner để tới được WireMock ở
      # localhost:8080. Workspace (kèm vendor/) đưa vào bằng `docker cp` (L13).
      - name: Run Tests
        run: |
          if [ "$PHP" = "$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" ]; then
            vendor/bin/phpunit --testdox --debug -c phpunit.xml.dist
          else
            name="ci-php-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PHP}"
            docker rm -f "$name" >/dev/null 2>&1 || true
            cid=$(docker create --name "$name" --network "container:$(hostname)" -w /app \
              "php:${PHP}-cli" \
              vendor/bin/phpunit --testdox --debug -c phpunit.xml.dist)
            docker cp "$PWD/." "$cid:/app"
            docker start -a "$cid" || true
            rc=$(docker wait "$cid")
            docker rm -f "$cid" >/dev/null
            exit "$rc"
          fi

      # ── ĐÃ GỠ 06/09/2026: bốn bước kế thừa từ upstream `paypay/paypayopa-sdk-php`
      # đều đã CHẾT, và một trong số đó là lỗ hổng thi hành mã từ xa. Bằng chứng
      # đo ngày 06/09/2026, không phải suy đoán:
      #
      #  1) "Code Climate before-build" + 4) "Code Climate after-build"
      #     `curl -L https://codeclimate.com/downloads/test-reporter/test-reporter-latest-linux-amd64`
      #     trả **HTTP 404** (codeclimate.com nay là trang tiếp thị Webflow —
      #     header `x-wf-region`, cookie `webflow.codeclimate.com`). Bước cũ ghi
      #     trang HTML 404 vào `./cc-test-reporter`, `chmod +x`, rồi CHẠY nó.
      #     Ngoài ra `CC_TEST_REPORTER_ID` ghim trong tệp là ID kho của PAYPAY,
      #     fork godx-jp không báo cáo vào tài khoản ấy được kể cả khi dịch vụ sống.
      #
      #  2) "Upload coverage results to Coveralls"
      #     `vendor/bin/php-coveralls` KHÔNG TỒN TẠI: `php-coveralls` không có
      #     trong `require-dev` của composer.json (kiểm `ls vendor/bin` sau
      #     `composer update`: chỉ có php-cs-fixer, php-parse, phpstan, phpunit).
      #     Và `COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}` là sai loại
      #     token — GITHUB_TOKEN không phải repo token của Coveralls.
      #
      #  3) "Upload to CoPilot"
      #     `bash <(curl -s https://copilot.blackducksoftware.com/ci/githubactions/scripts/upload)`
      #     Tên miền **NXDOMAIN** (đo: `host` → "not found: 3(NXDOMAIN)",
      #     `curl` → "Could not resolve host"). Đây là bước NGUY HIỂM NHẤT: nó
      #     tải mã lạ về và thi hành ngay trên runner — mà runner của đàn này
      #     dùng chung Docker daemon của host (docker.sock). Ai chiếm được tên
      #     miền đang bỏ trống ấy sẽ chạy được mã tuỳ ý với quyền trên toàn đàn,
      #     không riêng repo này. Một phụ thuộc RCE treo lơ lửng như vậy phải gỡ,
      #     không phải sửa.
      #
      # Fork này là hard fork: gói đã đổi tên (`godx-jp/paypayopa-php-sdk`),
      # quan hệ với upstream là MỘT CHIỀU ("track upstream releases… merge
      # security fixes" — GODX-FORK.md), và chính tệp workflow này đã được viết
      # lại toàn bộ ở 55bed90d. Nên bốn bước trên không còn ràng buộc gì với
      # upstream. Muốn dựng lại báo cáo coverage cho godx-jp thì mở tài khoản
      # riêng và thêm bước mới, đừng hồi sinh bốn bước này.

      # ZCleanupTest đã gọi `__admin/shutdown` nên WireMock thường tự tắt; bước
      # này chỉ chắc chắn không để lại container khi test đỏ giữa chừng.
      - name: Dọn WireMock
        if: always()
        run: docker rm -f "${WIREMOCK:-}" >/dev/null 2>&1 || true
